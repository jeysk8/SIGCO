<div class="modal fade modal-vino" id="modalActualizarpro{{ fila[0] }}" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <form class="modal-content" method="POST" action="{{ url_for('propiedad.consultar_propiedad') }}">
            <input type="hidden" name="accion" value="actualizar">
            <input type="hidden" name="idpro" value="{{ fila[0] }}">
            <div class="modal-header">
                <h5 class="modal-title">Actualizar propiedad {{ fila[0] }}</h5>
            </div>
            <div class="modal-body">

                <label class="mb-1">Tipo de vivienda</label>
                <select class="form-control mb-2" name="tipo_vivienda" required>
                    <option value="Apartamento" {% if fila[1] == 'Apartamento' %}selected{% endif %}>Apartamento</option>
                    <option value="Casa" {% if fila[1] == 'Casa' %}selected{% endif %}>Casa</option>
                </select>

                <label class="mb-1">Número / Torre</label>
                <input class="form-control mb-2" name="numvivienda" maxlength="100"
                       value="{{ fila[2] }}" required>

                <label class="mb-1">Estado</label>
                <select class="form-control mb-2" name="activo" required>
                    <option value="true"  {% if fila[3] %}selected{% endif %}>Activo</option>
                    <option value="false" {% if not fila[3] %}selected{% endif %}>Inactivo</option>
                </select>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn-vino-sec" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-vino">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
