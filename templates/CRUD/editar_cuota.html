<div class="modal fade modal-vino" id="modalActualizarcuo{{ fila[0] }}" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <form class="modal-content" method="POST" action="{{ url_for('cuota.consultar_cuota') }}">
            <input type="hidden" name="accion" value="actualizar">
            <input type="hidden" name="idcuo" value="{{ fila[0] }}">
            <div class="modal-header">
                <h5 class="modal-title">Actualizar cuota {{ fila[0] }}</h5>
            </div>
            <div class="modal-body">

                <label class="mb-1">Propiedad</label>
                <select class="form-control mb-2" name="idpro" required>
                    {% for p in propiedades %}
                        <option value="{{ p[0] }}" {% if p[0] == fila[6] %}selected{% endif %}>{{ p[1] }}</option>
                    {% endfor %}
                </select>

                <label class="mb-1">Fecha de generación</label>
                <input class="form-control mb-2" type="date" name="fecha_gen" value="{{ fila[2] }}" required>

                <label class="mb-1">Fecha límite de pago</label>
                <input class="form-control mb-2" type="date" name="fecha_lim" value="{{ fila[3] }}" required>

                <label class="mb-1">Monto</label>
                <input class="form-control mb-2" type="number" name="monto" min="0" step="0.01" value="{{ fila[4] }}" required>

                <label class="mb-1">Estado de la cuota</label>
                <select class="form-control mb-2" name="estado" required>
                    <option value="pendiente" {% if fila[5] == 'pendiente' %}selected{% endif %}>Pendiente</option>
                    <option value="parcial"   {% if fila[5] == 'parcial' %}selected{% endif %}>Parcial</option>
                    <option value="pagada"    {% if fila[5] == 'pagada' %}selected{% endif %}>Pagada</option>
                </select>

                <label class="mb-1">Activo</label>
                <select class="form-control mb-2" name="activo" required>
                    <option value="true"  {% if fila[7] %}selected{% endif %}>Activo</option>
                    <option value="false" {% if not fila[7] %}selected{% endif %}>Inactivo</option>
                </select>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn-vino-sec" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-vino">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
