<div class="modal fade modal-vino" id="modalRegistrarres" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <form class="modal-content" method="POST" action="{{ url_for('reserva.consultar_reserva') }}">
            <input type="hidden" name="accion" value="registrar">
            <div class="modal-header">
                <h5 class="modal-title">Registrar reserva</h5>
            </div>
            <div class="modal-body">

                <label class="mb-1">Tipo de servicio</label>
                <select class="form-control mb-2" name="tipo_servicio" required>
                    <option value="" disabled selected>Selecciona el servicio</option>
                    <option value="salon_eventos">Salón de eventos</option>
                    <option value="piscina">Piscina</option>
                </select>

                <label class="mb-1">Fecha</label>
                <input class="form-control mb-2" type="date" name="fecha" required>

                <label class="mb-1">Hora</label>
                <input class="form-control mb-2" type="time" name="hora" required>

                <label class="mb-1">Cantidad de invitados</label>
                <input class="form-control mb-2" type="number" name="cantidad_invitados" min="0" value="0" required>

                <label class="mb-1">Estado de la reserva</label>
                <select class="form-control mb-2" name="estado" required>
                    <option value="pendiente" selected>Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                </select>

                <label class="mb-1">Usuario</label>
                <select class="form-control mb-2" name="idusu" required>
                    <option value="" disabled selected>Selecciona el usuario</option>
                    {% for u in usuarios %}
                        <option value="{{ u[0] }}">{{ u[1] }}</option>
                    {% endfor %}
                </select>

                <label class="mb-1">Activo</label>
                <select class="form-control mb-2" name="activo" required>
                    <option value="true" selected>Activo</option>
                    <option value="false">Inactivo</option>
                </select>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn-vino-sec" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-vino">Guardar</button>
            </div>
        </form>
    </div>
</div>
