<div class="modal fade modal-vino" id="modalRegistrarpag" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <form class="modal-content" method="POST" action="{{ url_for('pago_crud.consultar_pago') }}">
            <input type="hidden" name="accion" value="registrar">
            <div class="modal-header">
                <h5 class="modal-title">Registrar pago</h5>
            </div>
            <div class="modal-body">

                <label class="mb-1">Cuota</label>
                <select class="form-control mb-2" name="idcuo1" required>
                    <option value="" disabled selected>Selecciona la cuota</option>
                    {% for c in cuotas %}
                        <option value="{{ c[0] }}">{{ c[1] }}</option>
                    {% endfor %}
                </select>

                <label class="mb-1">Usuario que paga</label>
                <select class="form-control mb-2" name="idusuario" required>
                    <option value="" disabled selected>Selecciona el usuario</option>
                    {% for u in usuarios %}
                        <option value="{{ u[0] }}">{{ u[1] }}</option>
                    {% endfor %}
                </select>

                <label class="mb-1">Fecha de pago</label>
                <input class="form-control mb-2" type="date" name="fecha_pago" required>

                <label class="mb-1">Monto pagado</label>
                <input class="form-control mb-2" type="number" name="monto_pago" min="0" step="0.01" required>

                <label class="mb-1">Método de pago</label>
                <select class="form-control mb-2" name="metodo" required>
                    <option value="" disabled selected>Selecciona el método</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="PSE">PSE</option>
                    <option value="Tarjeta">Tarjeta</option>
                </select>

                <label class="mb-1">Referencia (opcional)</label>
                <input class="form-control mb-2" name="referencia" maxlength="100">

                <label class="mb-1">URL del comprobante (opcional)</label>
                <input class="form-control mb-2" name="comprobante_url" maxlength="255"
                       placeholder="https://...">

                <label class="mb-1">Estado de validación</label>
                <select class="form-control mb-2" name="estado_validacion" required>
                    <option value="pendiente" selected>Pendiente</option>
                    <option value="aprobado">Aprobado</option>
                    <option value="rechazado">Rechazado</option>
                </select>

                <label class="mb-1">Observación del administrador (opcional)</label>
                <textarea class="form-control mb-2" name="observacion_admin" rows="2"></textarea>

                <label class="mb-1">Activo</label>
                <select class="form-control mb-2" name="activo" required>
                    <option value="true" selected>Activo</option>
                    <option value="false">Inactivo</option>
                </select>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn-vino-sec" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-vino">Guardar</button>
            </div>
        </form>
    </div>
</div>
