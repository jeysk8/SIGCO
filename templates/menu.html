<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjunto Residencial</title>
    <link rel="icon" href="../static/icono_1.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_menu.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<body class="seccion-blanca">

<header class="header-menu">
    <div class="navbar-menu">
        <span class="vino page-name">Conjunto Residencial</span>

        <div class="header-right">
            <span class="username vino">@usuario</span>

            <button class="icon-btn" type="button" aria-label="Notificaciones">

            </button>

            <div class="settings-wrapper">
                <button class="icon-btn" type="button" id="settings-btn" aria-haspopup="true" aria-expanded="false" aria-label="Configuración">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>

                <div class="settings-dropdown" id="settings-dropdown">
                    <a href="{{ url_for('auth.logout') }}">Cerrar sesión</a>  
                    <a href="#">Editar cuenta</a>
                    <a href="#">Ayuda</a>
                    <a href="#">Otras opciones</a>
                </div>
            </div>
        </div>
    </div>
</header>

<section class="search-section">
    <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Busca algo" aria-label="Buscar en el portal">
    </div>
</section>

<main class="cards-section">
    <div class="cards-grid">
        <a class="portal-card" href="{{ url_for('pages.pagos') }}">
            <span class="card-icon">🪙</span>
            <span class="card-name vino">Pagos</span>
        </a>

        <a class="portal-card" href="{{ url_for('pages.certificados') }}">
            <span class="card-icon">🧾</span>
            <span class="card-name vino">Certificados</span>
        </a>

        <a class="portal-card" href="{{ url_for('pages.solicitudes') }}">
            <span class="card-icon">✉️</span>
            <span class="card-name vino">Solicitudes</span>
        </a>

        <a class="portal-card" href="{{ url_for('pages.comunicados') }}">
            <span class="card-icon">📣</span>
            <span class="card-name vino">Comunicados</span>
        </a>

        <a class="portal-card" href="{{ url_for('pages.visitas') }}">
            <span class="card-icon">👤</span>

        </a>

        <a class="portal-card" href="{{ url_for('pages.comunidad') }}">
            <span class="card-icon">💬</span>
            <span class="card-name vino">Comunidad</span>
        </a>

        <a class="portal-card" href="{{ url_for('chat.chat') }}">
            <span class="card-icon">🗣️</span>
            <span class="card-name vino">Contactos</span>
        </a>

        <a class="portal-card" href="{{ url_for('pages.manual_convivencia') }}">
            <span class="card-icon">📙</span>
            <span class="card-name vino">Manual De Convivencia</span>
        </a>

    </div>
</main>

<script src="{{ url_for('static', filename='js/menu.js') }}"></script>
